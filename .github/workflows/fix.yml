name: Fix Szokereso

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
  /* Requested UI refinements */
  .freq-row {
    justify-content: center;
    align-items: center;
    max-width: 560px;
    margin: 10px auto 0;
    gap: 10px;
  }
  .freq-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 72px;
    min-height: 38px;
    padding: 7px 10px;
    border: 1px solid var(--rule);
    border-radius: 12px;
    text-align: center;
    font-size: 0.86rem;
  }
  .starter-item.narrow-starter {
    width: 50%;
    align-self: center;
  }
  @media (max-width: 600px) {
    .starter-item.narrow-starter { width: 50%; }
    .freq-row { max-width: 100%; gap: 8px; }
    .freq-chip { min-width: 68px; min-height: 36px; }
  }
'''
          if '/* Requested UI refinements */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          # Enter/Return: focus the next empty known-position field.
          if "if (event.key !== 'Enter') return;" not in s:
              needle = "    input.addEventListener('input', () => {\n      input.value = input.value.toUpperCase();\n      runSearch();\n    });"
              replacement = needle + "\n    input.addEventListener('keydown', (event) => {\n      if (event.key !== 'Enter') return;\n      event.preventDefault();\n      const cells = Array.from(patternRow.querySelectorAll('.letter-cell'));\n      const currentIndex = cells.indexOf(input);\n      const nextEmpty = cells.find((cell, index) => index > currentIndex && cell.value.trim() === '');\n      if (nextEmpty) {\n        nextEmpty.focus();\n        nextEmpty.select();\n      }\n    });"
              if needle not in s:
                  raise SystemExit('Could not find input handler')
              s = s.replace(needle, replacement, 1)

          # Make exactly these four starter cards half width.
          old = "details.className = 'starter-item';"
          new = "details.className = 'starter-item' + (['elrak', 'lerak', 'leari', 'kelta'].includes(c.word.toLowerCase()) ? ' narrow-starter' : '');"
          if old in s and 'narrow-starter' not in s[s.find(old)-100:s.find(old)+300]:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('index.html updated')

      - name: Commit changes and remove fix workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix.yml .github/workflows/apply-ui-fixes.yml
          git add index.html .github/workflows/fix.yml .github/workflows/apply-ui-fixes.yml
          git diff --cached --quiet || git commit -m "Fix word input navigation and starter UI"
          git push
