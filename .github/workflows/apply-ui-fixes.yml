name: Apply Szokereso UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '</style>'
          css = r'''

  /* Requested UI refinements */
  .freq-row {
    justify-content: center;
    align-items: center;
    max-width: 560px;
    margin: 10px auto 0;
    gap: 10px;
  }

  .freq-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 72px;
    min-height: 38px;
    padding: 7px 10px;
    border: 1px solid var(--rule);
    border-radius: 12px;
    text-align: center;
    font-size: 0.86rem;
  }

  .starter-item.narrow-starter {
    width: 50%;
    align-self: center;
  }

  @media (max-width: 600px) {
    .starter-item.narrow-starter { width: 50%; }
    .freq-row { max-width: 100%; gap: 8px; }
    .freq-chip { min-width: 68px; min-height: 36px; }
  }
'''
          if css_marker not in text:
              raise SystemExit('CSS marker not found')
          text = text.replace(css_marker, css + '\n' + css_marker, 1)

          old_build = '''    input.addEventListener('input', () => {
      input.value = input.value.toUpperCase();
      runSearch();
    });
    patternRow.appendChild(input);'''
          new_build = '''    input.addEventListener('input', () => {
      input.value = input.value.toUpperCase();
      runSearch();
    });
    input.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      const cells = Array.from(patternRow.querySelectorAll('.letter-cell'));
      const currentIndex = cells.indexOf(input);
      const nextEmpty = cells.find((cell, index) => index > currentIndex && cell.value.trim() === '');
      if (nextEmpty) {
        nextEmpty.focus();
        nextEmpty.select();
      }
    });
    patternRow.appendChild(input);'''
          if old_build not in text:
              raise SystemExit('buildPatternRow block not found')
          text = text.replace(old_build, new_build, 1)

          old_class = "    details.className = 'starter-item';"
          new_class = "    details.className = 'starter-item' + (['elrak', 'lerak', 'leari', 'kelta'].includes(c.word.toLowerCase()) ? ' narrow-starter' : '');"
          if old_class not in text:
              raise SystemExit('starter item class line not found')
          text = text.replace(old_class, new_class, 1)

          path.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-ui-fixes.yml
          git diff --cached --quiet && exit 0
          git commit -m "Improve word input navigation and UI cards"
          git push
